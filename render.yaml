# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Secret values (marked sync: false) are entered in the dashboard, never stored in git.
services:
  - type: web
    name: self-correcting-rag-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GRADER_MODEL
        value: openai/gpt-oss-20b
      - key: RATE_LIMIT_PER_HOUR
        value: "5"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS        # your Netlify URL, e.g. https://your-site.netlify.app
        sync: false
